# 푸시와 PR에서 테스트와 빌드를 확인한다.
#
# 데이터 갱신 워크플로가 자동으로 커밋하므로, 사람이 만든 변경이 조용히
# 깨지는 걸 막는 장치가 필요하다.
name: ci

on:
  push:
    branches-ignore:
      # 데이터만 바뀐 자동 커밋에서는 돌리지 않는다.
      - 'data/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: install python deps
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install node deps
        working-directory: frontend
        run: npm ci

      - name: build
        working-directory: frontend
        run: npm run build
